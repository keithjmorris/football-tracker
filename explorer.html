<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Data Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="explorer">
  <header class="ex-header">
    <h1>Football data explorer</h1>
    <p>Fetches raw JSON through our own <code>/api/football</code> proxy. Use <b>Download</b> to save a response as a file and attach it in the chat.</p>
  </header>

  <section class="ex-card">
    <h2>Quick checks</h2>
    <div class="ex-quick" id="quick"></div>
  </section>

  <section class="ex-card">
    <h2>Custom request</h2>
    <form id="form" class="ex-form">
      <label>Path
        <input id="path" value="/leagues" autocomplete="off" spellcheck="false">
      </label>
      <label>Parameters <small>(one per line, name=value)</small>
        <textarea id="params" rows="4" spellcheck="false">leagueName=Premiership</textarea>
      </label>
      <button type="submit">Fetch</button>
    </form>
  </section>

  <section class="ex-card">
    <div class="ex-result-head">
      <h2>Response</h2>
      <div class="ex-actions">
        <button type="button" id="copy" disabled>Copy</button>
        <button type="button" id="download" disabled>Download</button>
      </div>
    </div>
    <p id="meta" class="ex-meta">Nothing fetched yet.</p>
    <p id="link" class="ex-meta"></p>
    <div id="matches" class="ex-matches"></div>
    <pre id="out" class="ex-out"></pre>
  </section>

  <script>
    const londonDate = (offsetDays = 0) => {
      const d = new Date(Date.now() + offsetDays * 86400000);
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(d);
    };

    // League and team IDs from the working football apps. Always use IDs, never names.
    const QUICK = [
      ['Find Champions League ID', '/leagues', { leagueName: 'UEFA Champions League' }],
      ['Premier League table 2026', '/standings', { leagueId: 33973, season: 2026 }],
      ['Championship table 2026', '/standings', { leagueId: 34824, season: 2026 }],
      ['Arsenal home matches 2026', '/matches', { homeTeamId: 36526, season: 2026, limit: 100 }],
      ['Bolton away matches 2026', '/matches', { awayTeamId: 58652, season: 2026, limit: 100 }],
      ['Matches: today', '/matches', { date: londonDate(0), timezone: 'Europe/London' }],
      ['Matches: yesterday', '/matches', { date: londonDate(-1), timezone: 'Europe/London' }],
      ['Matches: next Saturday', '/matches', { date: nextSaturday(), timezone: 'Europe/London' }],
      ['Highlights: yesterday', '/highlights', { date: londonDate(-1), timezone: 'Europe/London' }],
    ];

    function nextSaturday() {
      for (let i = 1; i <= 7; i++) {
        const s = londonDate(i);
        if (new Date(s + 'T12:00:00Z').getUTCDay() === 6) return s;
      }
      return londonDate(0);
    }

    const $ = id => document.getElementById(id);
    let lastText = '';
    let lastName = 'football.json';

    function buildUrl(path, params) {
      const q = new URLSearchParams({ path, ...params });
      return '/api/football?' + q.toString();
    }

    async function run(path, params) {
      const url = buildUrl(path, params);
      $('meta').textContent = 'Loading…';
      $('link').innerHTML = '';
      $('out').textContent = '';
      $('matches').innerHTML = '';
      $('copy').disabled = $('download').disabled = true;
      const started = performance.now();
      try {
        const res = await fetch(url);
        const text = await res.text();
        let pretty = text;
        let json = null;
        try { json = JSON.parse(text); pretty = JSON.stringify(json, null, 2); } catch {}
        showMatchButtons(json, path);
        lastText = pretty;
        lastName = 'football' + path.replace(/\//g, '-') + '-' +
          Object.values(params).join('-').replace(/[^A-Za-z0-9-]+/g, '_').slice(0, 60) + '.json';
        const ms = Math.round(performance.now() - started);
        const cache = res.headers.get('X-Football-Cache-Seconds');
        $('meta').textContent = `HTTP ${res.status} · ${(text.length / 1024).toFixed(1)} KB · ${ms} ms` +
          (cache ? ` · shared cache ${cache}s` : '');
        $('meta').className = 'ex-meta ' + (res.ok ? 'ok' : 'bad');
        const a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = location.origin + url;
        $('link').append('URL: ', a);
        $('out').textContent = pretty.length > 400000
          ? pretty.slice(0, 400000) + '\n\n… (truncated on screen — Download has the full response)'
          : pretty;
        $('copy').disabled = $('download').disabled = false;
      } catch (err) {
        $('meta').textContent = 'Request failed: ' + err.message;
        $('meta').className = 'ex-meta bad';
      }
    }

    // When a response is a list of matches, offer one-tap buttons to open each match's detail.
    function showMatchButtons(json, path) {
      if (path.replace(/\/+$/, '') !== '/matches') return;
      const list = Array.isArray(json) ? json : Array.isArray(json && json.data) ? json.data : [];
      const matches = list.filter(m => m && m.id && m.homeTeam && m.awayTeam);
      const scoreText = m => (m.state && m.state.score && typeof m.state.score === 'object') ? (m.state.score.current || '') : ((m.state && m.state.score) || '');
      if (!matches.length) return;
      const box = $('matches');
      const note = document.createElement('p');
      note.className = 'ex-meta';
      note.textContent = `${matches.length} matches. Tap one to fetch its goals and cards (/events):`;
      box.append(note);
      for (const m of matches) {
        const b = document.createElement('button');
        b.type = 'button';
        const when = m.date ? new Date(m.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Europe/London' }) : '';
        const state = (m.state && m.state.description) || '';
        const score = scoreText(m) ? ` ${scoreText(m)}` : '';
        b.textContent = `${when} · ${m.homeTeam.name} v ${m.awayTeam.name} · ${state}${score}`;
        b.addEventListener('click', () => {
          $('path').value = '/events/' + m.id;
          $('params').value = '';
          run('/events/' + m.id, {});
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        box.append(b);
      }
    }

    for (const [label, path, params] of QUICK) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.addEventListener('click', () => {
        $('path').value = path;
        $('params').value = Object.entries(params).map(([k, v]) => `${k}=${v}`).join('\n');
        run(path, params);
      });
      $('quick').append(b);
    }

    $('form').addEventListener('submit', e => {
      e.preventDefault();
      const params = {};
      for (const line of $('params').value.split('\n')) {
        const i = line.indexOf('=');
        if (i > 0) params[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      }
      run($('path').value.trim(), params);
    });

    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(lastText); $('copy').textContent = 'Copied'; }
      catch { $('copy').textContent = 'Copy failed'; }
      setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
    });

    $('download').addEventListener('click', () => {
      const blob = new Blob([lastText], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = lastName;
      document.body.append(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
  </script>
</body>
</html>
